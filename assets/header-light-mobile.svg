<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-label="Alexander Vladimirov, full-stack developer">
  <style>
    .tail { transform-origin: 150px -12px; animation: sway 4s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(7deg); } }
    @media (prefers-reduced-motion: reduce) { .tail { animation: none; } }
  </style>
  <foreignObject x="0" y="76" width="420" height="340">
    <div xmlns="http://www.w3.org/1999/xhtml" class="win">
      <style>
        * { box-sizing: border-box; margin: 0; }
        .win {
          height: 340px; border-radius: 12px; overflow: hidden;
          background: #ffffff; border: 1px solid #d5dde2;
          font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #213547;
          display: flex; flex-direction: column;
        }
        .bar {
          height: 46px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 16px;
          background: #e9eef1; border-bottom: 1px solid #d5dde2; position: relative;
        }
        .dots { display: flex; gap: 8px; }
        .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
        .dots i:nth-child(1) { background: #ff5f57; }
        .dots i:nth-child(2) { background: #febc2e; }
        .dots i:nth-child(3) { background: #28c840; }
        .url {
          flex: 0 1 220px; margin-right: auto; height: 28px; border-radius: 8px;
          background: #ffffff; color: #5f7383; display: flex; align-items: center; gap: 8px; padding: 0 12px;
          font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
        .url b { color: #213547; font-weight: 500; }
        .load {
          position: absolute; left: 0; bottom: -2px; height: 3px; width: 100%; transform-origin: left;
          background: linear-gradient(to right, #00dc82, #34cdfe 50%, #0047e1);
          animation: load 1.4s cubic-bezier(.3,.6,.2,1) forwards, fade .4s 1.4s forwards;
        }
        @keyframes load { from { transform: scaleX(0); } to { transform: scaleX(1); } }
        @keyframes fade { to { opacity: 0; } }
        .page {
          flex: 1; padding: 24px 24px 24px; display: flex; flex-direction: column;
          opacity: 0; animation: show .6s 1.3s ease-out forwards;
        }
        @keyframes show { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        header { display: flex; justify-content: space-between; align-items: center; }
        .logo {
          width: 34px; height: 34px; border-radius: 9px; border: 2px solid #2f9e6e; color: #2f9e6e;
          display: grid; place-items: center; font-weight: 800; font-size: 14px; letter-spacing: -0.02em;
        }
        nav { display: flex; gap: 28px; font-size: 14px; color: #5f7383; }
        main { margin-top: auto; padding-top: 24px; max-width: 600px; }
        h1 { font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -0.03em; }
        p { font-size: 15px; line-height: 1.55; margin-top: 14px; max-width: 34em; }
        p + p { margin-top: 8px; color: #5f7383; }
        @media (prefers-reduced-motion: reduce) {
          .load { display: none; }
          .page { animation: none; opacity: 1; }
        }
      </style>
      <div class="bar">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="url">
          <svg xmlns="http://www.w3.org/2000/svg" width="11" height="13" viewBox="0 0 11 13"><rect x="0.5" y="5.5" width="10" height="7" rx="1.5" fill="#5f7383"/><path d="M2.5,5.5 V4 a3,3 0 0 1 6,0 V5.5" fill="none" stroke="#5f7383" stroke-width="1.4"/></svg>
          <span><b>eienrei.com</b></span>
        </div>
        <div class="load"></div>
      </div>
      <div class="page">
        <header><div class="logo">AV</div></header>
        <main>
          <h1>Hi, I'm Alexander.</h1>
          <p>Full-stack developer. I build interfaces with Vue and Nuxt, write backends in C#, and make sure it all runs in production.</p>
          <p>Software engineer at CRYPTO-PRO. Off the clock I'm learning Chinese and writing interactive novels.</p>
        </main>
      </div>
    </div>
  </foreignObject>
  <g transform="translate(196 77) scale(0.8)">
  <g class="cat" fill="#213547">
    <path class="tail" d="M154,-10 C176,-10 182,4 180,20 C179,32 184,40 194,42" fill="none" stroke="#213547" stroke-width="9" stroke-linecap="round"/>
    <path d="M30,0 C26,-22 44,-34 72,-35 C100,-36 122,-40 142,-36 C160,-32 166,-16 162,-6 C160,-2 156,0 150,0 Z"/>
    <rect x="4" y="-9" width="44" height="9" rx="4.5"/>
    <ellipse cx="36" cy="-40" rx="21" ry="18"/>
    <path d="M18,-47 Q16,-66 22,-68 Q28,-64 34,-56 Z M38,-56 Q46,-66 52,-68 Q57,-64 54,-47 Z" stroke="#213547" stroke-width="3" stroke-linejoin="round"/>
    <g fill="none" stroke="#e9eef1" stroke-width="2" stroke-linecap="round">
      <path d="M25,-41 q4,3 8,0 M40,-41 q4,3 8,0"/>
      <path d="M124,-3 C118,-20 138,-30 154,-18" opacity="0.45"/>
      <path d="M48,-1 C44,-5 40,-9 32,-9" opacity="0.45"/>
    </g>
  </g>
  </g>
</svg>
